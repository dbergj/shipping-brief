name: Morning brief

# Runs every morning and commits that day's data. 05:30 UTC is 06:30 or 07:30 in
# Norway depending on daylight saving — GitHub cron is always UTC.
# Note: scheduled runs on GitHub can be delayed at busy times, so the brief may
# land a little later than the exact minute below.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the snapshot back to the repo

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets are lifted to job-level env here for one specific reason: the
    # `secrets` context is NOT available inside a step's `if:` expression, and
    # referencing it there fails the whole run before any job starts. Job-level
    # `env` is available to step conditions, so the optional-brief step can test
    # for a key without that failure.
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The data collection itself uses only the standard library. The single
      # dependency is the Anthropic SDK, used once a day to write the brief —
      # and the run still succeeds without it.
      # Skipped entirely when no key is configured.
      - name: Install the Anthropic SDK (only used for the written brief)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: pip install --quiet anthropic

      - name: Collect today's data
        # The collector exits non-zero when a source fails but still writes a
        # good snapshot, so we record the status and keep going rather than
        # throwing away a run because one feed was down.
        shell: bash
        run: |
          set +e
          python3 collect/run.py 2>&1 | tee /tmp/collect.log
          # ${PIPESTATUS[0]} is the collector's own status; plain $? here would
          # report tee's, which is always 0.
          echo "COLLECT_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          set -e

      - name: Commit the snapshot
        run: |
          git config user.name  "shipping-brief bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changed; nothing to commit."
          else
            git commit -m "Brief for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report source failures
        if: always()
        run: |
          if [ "${COLLECT_EXIT:-0}" != "0" ]; then
            echo "::warning::One or more data sources failed. The dashboard still published, using previous values marked stale."
          fi
          grep -E "unavailable|failed|WARNING" /tmp/collect.log || true
